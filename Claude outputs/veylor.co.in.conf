# /etc/nginx/conf.d/veylor.co.in.conf
#
#   https://veylor.co.in/            → storefront   (frontent_main_site_v1/dist)
#   https://veylor.co.in/admin/      → admin portal (frontend_admin_webapp_v1/dist)
#   https://veylor.co.in/admin/api/  → Node API on 127.0.0.1:4000
#   https://veylor.co.in/api/        → Node API on 127.0.0.1:4000  (storefront)
#
# Changes from the draft, each for a reason that bites in production:
#
#   - added `location /api/`. The storefront calls /api/v1/products; without
#     this block those requests fall through to `location /` and are answered
#     with index.html, so the shop renders with no products and no error.
#   - dropped the Upgrade / Connection "upgrade" headers. Nothing in this API
#     speaks WebSocket, and sending `Connection: upgrade` on ordinary requests
#     (where $http_upgrade is empty) is malformed.
#   - long-lived cache for /admin/assets/. Vite fingerprints those filenames,
#     so a new build produces new names and stale caching cannot happen.
#
# REQUIRED on the API side, or login returns 403 from your own domain:
#
#   CORS_ORIGINS=https://veylor.co.in,https://www.veylor.co.in
#
# Browsers attach an `Origin` header to every POST, including same-origin ones,
# and nginx forwards it verbatim. The Vite dev proxy strips it, which is why
# this never shows up in development and always shows up on first deploy.

server {
    listen 80;
    listen [::]:80;

    server_name veylor.co.in www.veylor.co.in;

    # Certbot writes its challenge here before the redirect below applies.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else goes to HTTPS. Comment this out until certbot has run,
    # or the first request will redirect to a port that is not listening yet.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name veylor.co.in www.veylor.co.in;

    # certbot --nginx fills these in. Until then, run the port 80 server alone.
    ssl_certificate     /etc/letsencrypt/live/veylor.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veylor.co.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API ────────────────────────────────────────────────────────────────
    # Declared before the SPA locations for readability only: nginx picks the
    # LONGEST matching prefix regardless of order, so /admin/api/... reaches
    # this block and not `location /admin/`.

    location /admin/api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API sets `trust proxy`, and its rate limiter keys on the client
        # address — without this every caller looks like one IP.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # The storefront's public API. Missing from the draft.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Uploaded media is served by the API from its local storage directory.
    location /media/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Storage keys embed a UUID, so a given key's bytes never change.
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── admin portal ───────────────────────────────────────────────────────
    # Requires the admin to be built with base '/admin/', otherwise index.html
    # asks for /assets/... , which falls through to the storefront's catch-all
    # and returns HTML where JavaScript was expected.

    location /admin/assets/ {
        alias /home/ec2-user/frontend_admin_webapp_v1/dist/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /admin/ {
        alias /home/ec2-user/frontend_admin_webapp_v1/dist/;
        try_files $uri $uri/ /admin/index.html;

        # index.html itself must never be cached, or browsers keep loading the
        # previous build's asset names after a deploy.
        add_header Cache-Control "no-store";
    }

    # Bare /admin has no trailing slash, so `alias` would resolve one directory
    # too high. Redirect rather than special-case it.
    location = /admin {
        return 301 /admin/;
    }

    # ── storefront ─────────────────────────────────────────────────────────

    root /home/ec2-user/frontent_main_site_v1/dist;
    index index.html;

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # ── security ───────────────────────────────────────────────────────────

    location ~ /\. {
        deny all;
    }
}
