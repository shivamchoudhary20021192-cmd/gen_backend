# Local platform stack: MySQL, a one-shot migrator, the API and a worker.
#
#   cp .env.example .env        # then set the secrets
#   docker compose up --build
#
# The API serves the Admin API (/admin/api/:version), the Storefront API
# (/api/v1) and the Platform API (/platform/api/v1) on :4000. Background work
# runs in the separate `worker` service, so the API sets WORKER_EMBEDDED=false.

x-app: &app
  build: .
  image: veylog-api:local
  env_file: .env
  environment: &app-env
    NODE_ENV: ${NODE_ENV:-development}
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_USER: ${DB_USER:-veylog}
    DB_PASSWORD: ${DB_PASSWORD:-veylog}
    DB_NAME: ${DB_NAME:-veylog}
    TENANT_GUARD: ${TENANT_GUARD:-enforce}
  volumes:
    - media:/app/storage/media

services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-veylog}
      MYSQL_USER: ${DB_USER:-veylog}
      MYSQL_PASSWORD: ${DB_PASSWORD:-veylog}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app
    command: ["node", "dist/scripts/migrate.js", "up"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      WORKER_EMBEDDED: "false"
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["node", "dist/src/worker.js"]
    environment:
      <<: *app-env
      WORKER_PORT: "9464"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mysql:
  media:
